<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王陆807｜雅思听写练习｜章节导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding: 20px 12px;
            line-height: 1.65;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.08);
            padding: 28px;
        }
        h1 {
            font-size: 1.45rem;
            margin-bottom: 20px;
            color: #1f2937;
        }
        .summary-block {
            background-color: #fffbe6;
            border-left: 6px solid #facc15;
            padding: 18px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 28px;
        }
        /* 搜索跳转区 */
        .jump-panel {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid #b8d8ff;
        }
        .jump-panel h3 { margin-bottom: 14px; }
        .jump-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        /* 可搜索下拉组合框（章节、页数各一个） */
        .combo-wrap {
            position: relative;
            width: 220px;
        }
        .combo-wrap input {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #99c8ff;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }
        .combo-wrap input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(22,119,255,0.15);
        }
        .combo-wrap input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .combo-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #d0e3ff;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            max-height: 280px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }
        .combo-dropdown.open { display: block; }
        .combo-option {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .combo-option:last-child { border-bottom: none; }
        .combo-option:hover, .combo-option.active {
            background-color: #e6f4ff;
        }
        .combo-option .opt-meta {
            font-size: 0.85rem;
            color: #666;
        }
        .combo-option mark {
            background: #fff3bf;
            color: inherit;
        }
        .combo-empty {
            padding: 12px 14px;
            color: #999;
            font-size: 0.9rem;
        }
        .btn-go {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            background: #1677ff;
            color: white;
        }
        .btn-go:disabled { opacity: 0.5; cursor: not-allowed; }
        .search-hint {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
        }
        /* 章节卡片列表 */
        .chapter-list-title {
            font-size: 1.1rem;
            margin: 20px 0 12px;
            color: #1f2937;
        }
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .chapter-card {
            display: block;
            text-decoration: none;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px 18px;
            transition: all .15s;
            background: #fff;
        }
        .chapter-card:hover {
            background-color: #e6f4ff;
            border-color: #91caff;
            box-shadow: 0 2px 8px rgba(22,119,255,0.12);
        }
        .chapter-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1677ff;
            margin-bottom: 4px;
        }
        .chapter-meta {
            font-size: 0.88rem;
            color: #666;
        }
        .empty-tip {
            color: #999;
            padding: 20px 0;
        }
        /* 手机端下拉框占满整行 */
        @media (max-width: 560px) {
            .combo-wrap { width: 100%; }
            .btn-go { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 王陆807｜雅思听写练习｜章节导航</h1>

        <div class="summary-block">
            <p><strong>使用说明：</strong>先选章节、再选页数（两个框都支持输入搜索），点击"开始听写"跳转练习页面；也可以直接点击下方章节卡片进入。</p>
            <p>每个章节页面支持：乱序听写、真人美音、错题记录、Excel导出。</p>
        </div>

        <div class="jump-panel">
            <h3>🚀 快速跳转</h3>
            <div class="jump-row">
                <div class="combo-wrap">
                    <input type="text" id="chapterInput" placeholder="选择/搜索章节..." autocomplete="off">
                    <div class="combo-dropdown" id="chapterDropdown"></div>
                </div>
                <div class="combo-wrap">
                    <input type="text" id="pagesInput" placeholder="选择/搜索页数..." autocomplete="off" disabled>
                    <div class="combo-dropdown" id="pagesDropdown"></div>
                </div>
                <button class="btn-go" id="btnGo" disabled>开始听写 →</button>
            </div>
            <div class="search-hint">支持键盘 ↑↓ 选择、回车确认；先选章节后页数框才可用</div>
        </div>

        <h3 class="chapter-list-title">📚 全部章节</h3>
        <div class="chapter-grid" id="chapterGrid"></div>
        <div class="empty-tip" id="emptyTip" style="display:none;">暂无章节，请先生成章节页面并在 index.html 的 chapterList 数组中登记。</div>
    </div>

<script>
// ================= 章节清单（每新增一章，在此追加一条记录） =================
// 格式：{chapter: 章节号, pages: "起-止页", file: "html目录下的文件名", count: 单词数}
const chapterList = [
    {chapter: 7, pages: "40", file: "chapter7(40).html", count: 22},
    {chapter: 7, pages: "41-42", file: "chapter7(41-42).html", count: 56},
    {chapter: 7, pages: "43-44", file: "chapter7(43-44).html", count: 55},
];

// ================= 通用可搜索下拉组件 =================
// 用同一套逻辑驱动“章节”和“页数”两个组合框，互不混合
function createCombo(inputEl, dropdownEl, {getOptions, renderLabel, onSelect}){
    let matches = [];
    let activeIndex = -1;
    let selected = null; // 当前已确认选中的项

    function highlight(text, kw){
        if(!kw) return text;
        const idx = text.toLowerCase().indexOf(kw.toLowerCase());
        if(idx === -1) return text;
        return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+kw.length) + '</mark>' + text.slice(idx+kw.length);
    }

    function open(keyword){
        const kw = (keyword || '').trim().toLowerCase();
        const all = getOptions();
        matches = kw ? all.filter(o => renderLabel(o).toLowerCase().includes(kw)) : all;
        activeIndex = matches.length > 0 ? 0 : -1;
        dropdownEl.innerHTML = '';
        if(matches.length === 0){
            dropdownEl.innerHTML = '<div class="combo-empty">没有匹配项</div>';
        }else{
            matches.forEach((item, idx)=>{
                const div = document.createElement('div');
                div.className = 'combo-option' + (idx === activeIndex ? ' active' : '');
                div.innerHTML = highlight(renderLabel(item), keyword ? keyword.trim() : '');
                // mousedown 先于 blur 触发，保证点击可选中
                div.addEventListener('mousedown', e=>{
                    e.preventDefault();
                    choose(item);
                });
                dropdownEl.appendChild(div);
            });
        }
        dropdownEl.classList.add('open');
    }

    function close(){
        dropdownEl.classList.remove('open');
        activeIndex = -1;
    }

    function refreshActive(){
        const opts = dropdownEl.querySelectorAll('.combo-option');
        opts.forEach((el, idx)=>{
            el.classList.toggle('active', idx === activeIndex);
            if(idx === activeIndex) el.scrollIntoView({block:'nearest'});
        });
    }

    function choose(item){
        selected = item;
        inputEl.value = renderLabel(item);
        close();
        onSelect(item);
    }

    inputEl.addEventListener('focus', ()=>{ inputEl.select(); open(''); });
    inputEl.addEventListener('input', ()=>{
        selected = null;
        onSelect(null); // 输入变化即视为未确认，下游联动重置
        open(inputEl.value);
    });
    inputEl.addEventListener('blur', ()=>{ setTimeout(close, 120); });
    inputEl.addEventListener('keydown', e=>{
        if(!dropdownEl.classList.contains('open')) return;
        if(e.key === 'ArrowDown'){
            e.preventDefault();
            if(matches.length > 0){ activeIndex = (activeIndex + 1) % matches.length; refreshActive(); }
        }else if(e.key === 'ArrowUp'){
            e.preventDefault();
            if(matches.length > 0){ activeIndex = (activeIndex - 1 + matches.length) % matches.length; refreshActive(); }
        }else if(e.key === 'Enter'){
            e.preventDefault();
            if(activeIndex >= 0 && matches[activeIndex]) choose(matches[activeIndex]);
        }else if(e.key === 'Escape'){
            close();
        }
    });

    return {
        get selected(){ return selected; },
        reset(){
            selected = null;
            inputEl.value = '';
            close();
        }
    };
}

// ================= 章节 → 页数 二级联动 =================
const chapterInput = document.querySelector('#chapterInput');
const chapterDropdown = document.querySelector('#chapterDropdown');
const pagesInput = document.querySelector('#pagesInput');
const pagesDropdown = document.querySelector('#pagesDropdown');
const btnGo = document.querySelector('#btnGo');
const chapterGrid = document.querySelector('#chapterGrid');
const emptyTip = document.querySelector('#emptyTip');

// 跳转到章节页面（相对路径，GitHub Pages 与本地 http 服务均可用）
function gotoChapter(file){
    window.location.href = 'html/' + encodeURIComponent(file);
}

// 章节号去重升序
function chapterOptions(){
    return [...new Set(chapterList.map(c => c.chapter))].sort((a,b)=>a-b).map(ch => ({chapter: ch}));
}

// 指定章节下的页数记录，按页数升序
function pagesOptions(chapter){
    return chapterList
        .filter(c => c.chapter === chapter)
        .sort((a,b)=> a.pages.localeCompare(b.pages, undefined, {numeric:true}));
}

let pagesCombo; // 先声明，章节选中回调里会用到

const chapterCombo = createCombo(chapterInput, chapterDropdown, {
    getOptions: chapterOptions,
    renderLabel: o => `Chapter ${o.chapter}`,
    onSelect: (item)=>{
        // 章节变化：重置页数框
        pagesCombo && pagesCombo.reset();
        btnGo.disabled = true;
        if(item){
            pagesInput.disabled = false;
            const list = pagesOptions(item.chapter);
            // 该章节只有一个页数区间时自动选中
            if(list.length === 1){
                pagesInput.value = `第${list[0].pages}页（${list[0].count}词）`;
                pagesCombo.autoSelect(list[0]);
            }else{
                pagesInput.focus();
            }
        }else{
            pagesInput.disabled = true;
        }
    }
});

pagesCombo = createCombo(pagesInput, pagesDropdown, {
    getOptions: ()=> chapterCombo.selected ? pagesOptions(chapterCombo.selected.chapter) : [],
    renderLabel: o => `第${o.pages}页（${o.count}词）`,
    onSelect: (item)=>{
        btnGo.disabled = !item;
    }
});

// 补充：外部直接设置页数选中项（单页数区间自动选中用）
pagesCombo.autoSelect = function(item){
    // 通过模拟选择保持内部状态一致
    pagesInput.value = `第${item.pages}页（${item.count}词）`;
    btnGo.disabled = false;
    this._auto = item;
};

btnGo.addEventListener('click', ()=>{
    const item = pagesCombo.selected || pagesCombo._auto;
    if(item) gotoChapter(item.file);
});

// ================= 章节卡片列表 =================
function renderChapterGrid(){
    chapterGrid.innerHTML = '';
    if(chapterList.length === 0){
        emptyTip.style.display = 'block';
        return;
    }
    emptyTip.style.display = 'none';
    const sorted = [...chapterList].sort((a,b)=>
        a.chapter - b.chapter || a.pages.localeCompare(b.pages, undefined, {numeric:true})
    );
    sorted.forEach(item=>{
        const a = document.createElement('a');
        a.className = 'chapter-card';
        a.href = 'html/' + encodeURIComponent(item.file);
        a.innerHTML = `
            <div class="chapter-name">Chapter ${item.chapter}</div>
            <div class="chapter-meta">第 ${item.pages} 页 ｜ ${item.count} 词</div>
        `;
        chapterGrid.appendChild(a);
    });
}

// ================= 初始化 =================
renderChapterGrid();
</script>
</body>
</html>
